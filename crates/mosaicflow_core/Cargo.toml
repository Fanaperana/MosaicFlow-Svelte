[package]
name = "mosaicflow_core"
version = "0.1.0"
description = "MosaicFlow core utilities - error handling, file I/O, ID generation, time, paths"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
