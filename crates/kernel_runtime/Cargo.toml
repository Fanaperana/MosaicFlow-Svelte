[package]
name = "kernel_runtime"
version = "0.1.0"
edition = "2021"
description = "MosaicFlow Kernel Runtime - Plugin loading, dispatch, and event bus"
authors = ["MosaicFlow Team"]

[dependencies]
kernel_api = { path = "../kernel_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
parking_lot = "0.12"
